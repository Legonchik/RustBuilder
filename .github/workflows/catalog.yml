name: Каталог баз

# Каталог лежит в папке catalog-repo основного репозитория:
# проверка присланных баз, сборка index.json и страницы для лайков (👍 на issue).
on:
  pull_request:
    paths: ["catalog-repo/bases/**"]
  push:
    branches: [main]
    paths: ["catalog-repo/bases/**", "catalog-repo/scripts/**", ".github/workflows/catalog.yml"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

defaults:
  run:
    working-directory: catalog-repo

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Проверка баз
        run: node scripts/build-index.mjs --check

  index:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # нужна история, чтобы узнать автора и дату каждой базы
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Сборка index.json
        run: node scripts/build-index.mjs
      - name: Страницы для лайков
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CATALOG_DIR: catalog-repo/
        run: node scripts/sync-likes.mjs
      - name: Коммит index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || git commit -m "Обновить index.json каталога"
          git push
